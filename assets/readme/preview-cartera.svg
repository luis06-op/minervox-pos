<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Vista previa del semáforo de cartera">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1530"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="560" rx="16" ry="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="0" y="0" width="1000" height="560" fill="url(#cardBg)"/>

    <!-- barra superior -->
    <rect x="0" y="0" width="1000" height="46" fill="#111c33"/>
    <circle cx="26" cy="23" r="6.5" fill="#ef4444"/>
    <circle cx="48" cy="23" r="6.5" fill="#eab308"/>
    <circle cx="70" cy="23" r="6.5" fill="#22c55e"/>
    <text x="96" y="28" font-size="14" fill="#94a3b8">MINERVOX — Cartera</text>
    <text x="976" y="28" font-size="13" fill="#64748b" text-anchor="end">Plazo otorgado: 8 a 15 días</text>

    <!-- menú lateral -->
    <rect x="0" y="46" width="196" height="514" fill="#0b1530"/>
    <rect x="26" y="76" width="14" height="14" rx="3" fill="#334155"/>
    <text x="50" y="89" font-size="14" fill="#94a3b8">Ventas</text>

    <rect x="14" y="110" width="168" height="38" rx="9" fill="#1d4ed8"/>
    <rect x="0" y="110" width="4" height="38" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="122" width="14" height="14" rx="3" fill="#bfdbfe"/>
    <text x="50" y="135" font-size="14" fill="#ffffff">Cartera</text>

    <rect x="26" y="168" width="14" height="14" rx="3" fill="#334155"/>
    <text x="50" y="181" font-size="14" fill="#94a3b8">Mi Plata</text>

    <rect x="26" y="214" width="14" height="14" rx="3" fill="#334155"/>
    <text x="50" y="227" font-size="14" fill="#94a3b8">Inventario</text>

    <rect x="26" y="260" width="14" height="14" rx="3" fill="#334155"/>
    <text x="50" y="273" font-size="14" fill="#94a3b8">Usuarios</text>

    <text x="26" y="534" font-size="11" fill="#475569">El Bagre · UTC-5</text>

    <!-- encabezado -->
    <text x="220" y="86" font-size="19" font-weight="700" fill="#f1f5f9">Semáforo de cartera</text>

    <!-- filtros -->
    <rect x="220" y="104" width="76" height="30" rx="15" fill="#1d4ed8"/>
    <text x="258" y="124" font-size="12" fill="#ffffff" text-anchor="middle">Todos</text>

    <rect x="306" y="104" width="94" height="30" rx="15" fill="#7f1d1d" stroke="#ef4444" stroke-opacity="0.7"/>
    <text x="353" y="124" font-size="12" fill="#fca5a5" text-anchor="middle">Vencidos</text>

    <rect x="410" y="104" width="104" height="30" rx="15" fill="#78350f" stroke="#f59e0b" stroke-opacity="0.7"/>
    <text x="462" y="124" font-size="12" fill="#fcd34d" text-anchor="middle">Por vencer</text>

    <rect x="524" y="104" width="76" height="30" rx="15" fill="#14532d" stroke="#22c55e" stroke-opacity="0.7"/>
    <text x="562" y="124" font-size="12" fill="#86efac" text-anchor="middle">Al día</text>

    <!-- tarjetas del semáforo -->
    <g>
      <rect x="220" y="150" width="244" height="112" rx="12" fill="#111c33" stroke="#7f1d1d"/>
      <rect x="220" y="150" width="244" height="4" rx="2" fill="#ef4444"/>
      <text x="238" y="184" font-size="11" font-weight="700" letter-spacing="2" fill="#f87171">VENCIDOS</text>
      <text x="238" y="226" font-size="34" font-weight="800" fill="#ffffff">2</text>
      <text x="238" y="248" font-size="12" fill="#94a3b8">$ 1.240.000 pendientes</text>
      <circle cx="432" cy="184" r="9" fill="#ef4444">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="9;12;9" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <rect x="474" y="150" width="244" height="112" rx="12" fill="#111c33" stroke="#78350f"/>
      <rect x="474" y="150" width="244" height="4" rx="2" fill="#f59e0b"/>
      <text x="492" y="184" font-size="11" font-weight="700" letter-spacing="2" fill="#fbbf24">POR VENCER</text>
      <text x="492" y="226" font-size="34" font-weight="800" fill="#ffffff">5</text>
      <text x="492" y="248" font-size="12" fill="#94a3b8">$ 3.980.000 pendientes</text>
      <circle cx="686" cy="184" r="9" fill="#f59e0b"/>
    </g>

    <g>
      <rect x="728" y="150" width="244" height="112" rx="12" fill="#111c33" stroke="#14532d"/>
      <rect x="728" y="150" width="244" height="4" rx="2" fill="#22c55e"/>
      <text x="746" y="184" font-size="11" font-weight="700" letter-spacing="2" fill="#4ade80">AL DÍA</text>
      <text x="746" y="226" font-size="34" font-weight="800" fill="#ffffff">12</text>
      <text x="746" y="248" font-size="12" fill="#94a3b8">$ 8.150.000 vigentes</text>
      <circle cx="940" cy="184" r="9" fill="#22c55e"/>
    </g>

    <!-- tabla de deudores -->
    <text x="220" y="292" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">CLIENTE</text>
    <text x="470" y="292" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">PLAZO</text>
    <text x="740" y="292" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">SALDO</text>
    <text x="874" y="292" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">ACCIÓN</text>
    <line x1="220" y1="302" x2="972" y2="302" stroke="#1e293b"/>

    <!-- fila 1: vencida -->
    <text x="220" y="326" font-size="13" fill="#e2e8f0">Comercializadora El Roble S.A.S.</text>
    <text x="220" y="343" font-size="11" fill="#64748b">C.C. 94.512.301 · venció hace 3 días</text>
    <rect x="470" y="318" width="160" height="8" rx="4" fill="#1e293b"/>
    <rect x="470" y="318" height="8" rx="4" fill="#ef4444" width="0">
      <animate attributeName="width" from="0" to="160" dur="1.3s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="470" y="343" font-size="11" fill="#f87171">15 de 15 días</text>
    <text x="740" y="332" font-size="14" font-weight="700" fill="#e2e8f0">$ 640.000</text>
    <rect x="868" y="316" width="104" height="30" rx="8" fill="#22c55e">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1s" fill="freeze"/>
    </rect>
    <text x="920" y="336" font-size="12" font-weight="700" fill="#052e16" text-anchor="middle">
      WhatsApp
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1s" fill="freeze"/>
    </text>
    <line x1="220" y1="358" x2="972" y2="358" stroke="#1e293b" stroke-opacity="0.7"/>

    <!-- fila 2: por vencer -->
    <text x="220" y="382" font-size="13" fill="#e2e8f0">Minera Sierra Blanca Ltda.</text>
    <text x="220" y="399" font-size="11" fill="#64748b">N.I.T. 830.115.442-1 · 12 días de plazo</text>
    <rect x="470" y="374" width="160" height="8" rx="4" fill="#1e293b"/>
    <rect x="470" y="374" height="8" rx="4" fill="#f59e0b" width="0">
      <animate attributeName="width" from="0" to="128" dur="1.3s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="470" y="399" font-size="11" fill="#fcd34d">12 de 15 días</text>
    <text x="740" y="388" font-size="14" font-weight="700" fill="#e2e8f0">$ 1.180.000</text>
    <rect x="868" y="372" width="104" height="30" rx="8" fill="#22c55e">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>
    </rect>
    <text x="920" y="392" font-size="12" font-weight="700" fill="#052e16" text-anchor="middle">
      WhatsApp
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.3s" fill="freeze"/>
    </text>
    <line x1="220" y1="414" x2="972" y2="414" stroke="#1e293b" stroke-opacity="0.7"/>

    <!-- fila 3: por vencer -->
    <text x="220" y="438" font-size="13" fill="#e2e8f0">Insumos del Caribe S.A.</text>
    <text x="220" y="455" font-size="11" fill="#64748b">N.I.T. 900.442.118-9 · 8 días de plazo</text>
    <rect x="470" y="430" width="160" height="8" rx="4" fill="#1e293b"/>
    <rect x="470" y="430" height="8" rx="4" fill="#f59e0b" width="0">
      <animate attributeName="width" from="0" to="85" dur="1.3s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="470" y="455" font-size="11" fill="#fcd34d">8 de 15 días</text>
    <text x="740" y="444" font-size="14" font-weight="700" fill="#e2e8f0">$ 320.500</text>
    <rect x="868" y="428" width="104" height="30" rx="8" fill="#22c55e">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/>
    </rect>
    <text x="920" y="448" font-size="12" font-weight="700" fill="#052e16" text-anchor="middle">
      WhatsApp
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/>
    </text>
    <line x1="220" y1="470" x2="972" y2="470" stroke="#1e293b" stroke-opacity="0.7"/>

    <!-- fila 4: al día -->
    <text x="220" y="494" font-size="13" fill="#e2e8f0">Distribuidora La Esmeralda</text>
    <text x="220" y="511" font-size="11" fill="#64748b">C.C. 71.220.884 · abono registrado hoy</text>
    <rect x="470" y="486" width="160" height="8" rx="4" fill="#1e293b"/>
    <rect x="470" y="486" height="8" rx="4" fill="#22c55e" width="0">
      <animate attributeName="width" from="0" to="50" dur="1.3s" begin="1.1s" fill="freeze"/>
    </rect>
    <text x="470" y="511" font-size="11" fill="#86efac">5 de 15 días</text>
    <text x="740" y="500" font-size="14" font-weight="700" fill="#e2e8f0">$ 96.000</text>
    <rect x="868" y="484" width="104" height="30" rx="8" fill="#1d4ed8">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
    </rect>
    <text x="920" y="504" font-size="12" font-weight="700" fill="#dbeafe" text-anchor="middle">
      Abonar
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
    </text>

    <text x="220" y="542" font-size="11" fill="#475569">Abonos, acuerdos de pago y estado de cuenta quedan registrados en cada crédito.</text>
  </g>
</svg>
