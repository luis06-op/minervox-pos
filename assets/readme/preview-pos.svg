<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Vista previa del módulo de punto de venta">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1530"/>
    </linearGradient>
    <linearGradient id="btnShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="560" rx="16" ry="16"/></clipPath>
    <clipPath id="btnClip"><rect x="644" y="424" width="316" height="52" rx="10" ry="10"/></clipPath>
    <clipPath id="modeClip"><rect x="730" y="62" width="170" height="34" rx="17" ry="17"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="0" y="0" width="1000" height="560" fill="url(#cardBg)"/>

    <!-- barra superior -->
    <rect x="0" y="0" width="1000" height="46" fill="#111c33"/>
    <circle cx="26" cy="23" r="6.5" fill="#ef4444"/>
    <circle cx="48" cy="23" r="6.5" fill="#eab308"/>
    <circle cx="70" cy="23" r="6.5" fill="#22c55e"/>
    <text x="96" y="28" font-size="14" fill="#94a3b8">MINERVOX — Punto de Venta</text>
    <text x="976" y="28" font-size="13" fill="#64748b" text-anchor="end">Cajero: Luis · sesión activa</text>

    <!-- menú lateral -->
    <rect x="0" y="46" width="196" height="514" fill="#0b1530"/>
    <rect x="14" y="64" width="168" height="38" rx="9" fill="#1d4ed8"/>
    <rect x="0" y="64" width="4" height="38" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="76" width="14" height="14" rx="3" fill="#bfdbfe"/>
    <text x="50" y="89" font-size="14" fill="#ffffff">Ventas</text>

    <rect x="26" y="122" width="14" height="14" rx="3" fill="#334155"/>
    <text x="50" y="135" font-size="14" fill="#94a3b8">Cartera</text>

    <rect x="26" y="168" width="14" height="14" rx="3" fill="#334155"/>
    <text x="50" y="181" font-size="14" fill="#94a3b8">Mi Plata</text>

    <rect x="26" y="214" width="14" height="14" rx="3" fill="#334155"/>
    <text x="50" y="227" font-size="14" fill="#94a3b8">Inventario</text>

    <rect x="26" y="260" width="14" height="14" rx="3" fill="#334155"/>
    <text x="50" y="273" font-size="14" fill="#94a3b8">Usuarios</text>

    <text x="26" y="534" font-size="11" fill="#475569">El Bagre · UTC-5</text>

    <!-- encabezado de la vista -->
    <text x="220" y="86" font-size="19" font-weight="700" fill="#f1f5f9">Nueva venta</text>

    <g>
      <text x="712" y="85" font-size="14" font-weight="700" fill="#4ade80" text-anchor="end">MODO: CONTADO</text>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.52;0.98;1" dur="7s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text x="712" y="85" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="end">MODO: CRÉDITO</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.98;1" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- interruptor contado / crédito -->
    <rect x="730" y="62" width="170" height="34" rx="17" fill="#1e293b"/>
    <g clip-path="url(#modeClip)">
      <rect x="730" y="62" width="85" height="34" fill="#14532d" opacity="0.85">
        <animate attributeName="x" values="730;815;815;730;730" keyTimes="0;0.5;0.52;0.98;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cy="79" r="15" fill="#f8fafc">
      <animate attributeName="cx" values="750;880;880;750;750" keyTimes="0;0.5;0.52;0.98;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- buscador -->
    <rect x="220" y="104" width="380" height="40" rx="10" fill="#111c33" stroke="#334155"/>
    <circle cx="243" cy="121" r="7" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="248" y1="126" x2="255" y2="133" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <text x="268" y="129" font-size="14" fill="#e2e8f0">soda cáustica</text>
    <rect x="366" y="113" width="2" height="20" fill="#38bdf8">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="584" y="129" font-size="11" fill="#475569" text-anchor="end">4 resultados</text>

    <!-- lista de productos -->
    <g>
      <rect x="220" y="160" width="380" height="48" rx="10" fill="#111c33" stroke="#1e293b"/>
      <text x="236" y="181" font-size="14" fill="#f1f5f9">Ácido sulfúrico 98%</text>
      <text x="236" y="197" font-size="11" fill="#64748b">Bidón 1 L · stock 24</text>
      <text x="584" y="186" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="end">$ 48.500</text>
    </g>

    <g>
      <rect x="220" y="218" width="380" height="48" rx="10" fill="#111c33" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="236" y="239" font-size="14" fill="#f1f5f9">Soda cáustica escamas</text>
      <text x="236" y="255" font-size="11" fill="#64748b">Costal 25 kg · stock 6</text>
      <text x="584" y="244" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="end">$ 132.000</text>
    </g>

    <g>
      <rect x="220" y="276" width="380" height="48" rx="10" fill="#111c33" stroke="#1e293b"/>
      <text x="236" y="297" font-size="14" fill="#f1f5f9">Cianuro de sodio</text>
      <text x="236" y="313" font-size="11" fill="#64748b">Controlado · stock 3</text>
      <rect x="436" y="286" width="78" height="18" rx="9" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.8"/>
      <text x="475" y="299" font-size="9" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">CONTROLADO</text>
      <text x="584" y="302" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="end">$ 410.000</text>
    </g>

    <g>
      <rect x="220" y="334" width="380" height="48" rx="10" fill="#111c33" stroke="#1e293b"/>
      <text x="236" y="355" font-size="14" fill="#f1f5f9">Reactivos varios</text>
      <text x="236" y="371" font-size="11" fill="#64748b">Unidad · stock 12</text>
      <text x="584" y="360" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="end">$ 15.900</text>
    </g>

    <!-- alerta de sustancia controlada -->
    <rect x="220" y="396" width="380" height="64" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-opacity="0.65"/>
    <circle cx="242" cy="418" r="6" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="258" y="422" font-size="13" font-weight="700" fill="#fbbf24">Sustancia controlada</text>
    <text x="258" y="442" font-size="12" fill="#cbd5e1">Ingresa la cédula del cliente para continuar</text>

    <text x="220" y="492" font-size="11" fill="#475569">Al confirmar se descuenta el stock y el movimiento queda en el kardex.</text>

    <!-- carrito -->
    <rect x="624" y="160" width="356" height="372" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="644" y="188" font-size="14" font-weight="700" fill="#e2e8f0">Carrito</text>
    <text x="960" y="188" font-size="12" fill="#64748b" text-anchor="end">3 ítems</text>
    <line x1="644" y1="202" x2="960" y2="202" stroke="#1e293b"/>

    <text x="644" y="226" font-size="13" fill="#cbd5e1">Soda cáustica escamas</text>
    <text x="644" y="243" font-size="11" fill="#64748b">1 × $ 132.000</text>
    <text x="960" y="234" font-size="13" fill="#e2e8f0" text-anchor="end">$ 132.000</text>

    <text x="644" y="266" font-size="13" fill="#cbd5e1">Ácido sulfúrico 98%</text>
    <text x="644" y="283" font-size="11" fill="#64748b">1 × $ 48.500</text>
    <text x="960" y="274" font-size="13" fill="#e2e8f0" text-anchor="end">$ 48.500</text>

    <text x="644" y="306" font-size="13" fill="#cbd5e1">Reactivos varios</text>
    <text x="644" y="323" font-size="11" fill="#64748b">0 × $ 15.900</text>
    <text x="960" y="314" font-size="13" fill="#e2e8f0" text-anchor="end">$ 0</text>

    <line x1="644" y1="342" x2="960" y2="342" stroke="#1e293b"/>

    <text x="644" y="366" font-size="13" fill="#94a3b8">Subtotal</text>
    <text x="960" y="366" font-size="13" fill="#cbd5e1" text-anchor="end">$ 180.500</text>
    <text x="644" y="392" font-size="13" fill="#94a3b8">Descuento contado</text>
    <text x="960" y="392" font-size="13" fill="#4ade80" text-anchor="end">− $ 15.900</text>

    <text x="644" y="412" font-size="22" font-weight="800" fill="#f1f5f9">TOTAL</text>
    <text x="960" y="412" font-size="22" font-weight="800" fill="#4ade80" text-anchor="end">$ 164.600</text>

    <rect x="644" y="424" width="316" height="52" rx="10" fill="#22c55e"/>
    <g clip-path="url(#btnClip)">
      <rect x="560" y="424" width="120" height="52" fill="url(#btnShine)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="440 0" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="802" y="457" font-size="17" font-weight="800" fill="#052e16" text-anchor="middle" letter-spacing="2">COBRAR</text>

    <text x="802" y="498" font-size="11" fill="#64748b" text-anchor="middle">Se genera el recibo en PDF al confirmar</text>
  </g>
</svg>
