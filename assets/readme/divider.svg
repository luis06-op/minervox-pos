<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="48" viewBox="0 0 1200 48" role="img" aria-label="Separador animado">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="0" y1="24" x2="1200" y2="24" stroke="url(#line)" stroke-width="2" stroke-dasharray="16 12">
    <animate attributeName="stroke-dashoffset" from="0" to="56" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" from="-60 0" to="1260 0" dur="5.5s" repeatCount="indefinite"/>
    <polygon points="0,13 15,24 0,35 -15,24" fill="url(#dot)"/>
  </g>
</svg>
